spring:
  application:
    name: multi-tenant-notification-system

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: notification
    password: notification
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: "change-me-phase2-local-dev-secret-key-32chars-min"
    expiration-ms: 3600000
  bootstrap:
    platform-admin:
      email: platform.admin@system.local
      password: Admin@123
      full-name: Platform Administrator

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.multitenant.notification: DEBUG
