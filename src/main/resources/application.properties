spring.application.name=notificatin.system

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_system
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.url=jdbc:postgresql://localhost:5432/notification_system
spring.flyway.user=user
spring.flyway.password=password

# Retry Configuration
notification.retry.max-attempts=3
notification.retry.initial-delay-ms=1000
notification.retry.max-delay-ms=5000

# Rate Limiting Configuration
notification.rate-limiting.enabled=true
notification.rate-limiting.limit=100
notification.rate-limiting.window-in-seconds=60
